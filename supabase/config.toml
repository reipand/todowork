# Supabase CLI configuration for Todowork.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "todowork"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Schema migrations live in supabase/migrations.
major_version = 15

[db.seed]
enabled = false
# No seed data. Production dashboards must show real user data only, and seeding fictional
# tasks risks it leaking into a screenshot or a demo that looks like real activity.

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Both the bare origin and the wildcard path are listed because Supabase matches the exact
# redirect target, and auth callbacks can land on either form depending on configuration.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "https://tasks.example.com",
  "https://tasks.example.com/**",
  "https://tasks.example.com/auth/callback"
]
jwt_expiry = 3600
# Sessions must survive an app restart on mobile, so refresh tokens are enabled, which is the
# default. Rotation is on so a stolen refresh token is single-use.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
# Email/password signup is the primary method.
enable_signup = true
# Disabled by default for local development so signup can be tested end to end without an
# inbox. Turn this ON for production: see docs/DEPLOYMENT.md.
enable_confirmations = false
# Required for the forgot-password flow to be functional.
enable_email_autoconfirm = false

[auth.email.template.confirmation]
subject = "Confirm your Todowork account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Todowork password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Todowork email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You have been invited to Todowork"
content_path = "./supabase/templates/invite.html"

[analytics]
enabled = false

# Local notifications do not require push infrastructure, so no push provider is configured.
# See docs/KNOWN-LIMITATIONS.md for what that means for background reminders.
